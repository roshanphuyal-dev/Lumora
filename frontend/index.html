<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumora</title>
    <script>
      // Applies the persisted theme before first paint so there's no light-mode flash
      // on a dark-mode reload. Mirrors frontend/src/hooks/use-theme.tsx's applyTheme --
      // keep both in sync if the storage keys or resolution logic change.
      (function () {
        try {
          var mode = localStorage.getItem("lumora.theme-mode")
          var accent = localStorage.getItem("lumora.theme-accent")
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
          var dark = mode === "dark" || (mode !== "light" && prefersDark)
          if (dark) document.documentElement.classList.add("dark")
          if (accent && accent !== "emerald") document.documentElement.setAttribute("data-accent", accent)
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <!--
    THESIS: Sidebar app-shell over a scattered stat grid -- one persistent home for
    the single Phase 1 action (get material in), not a dashboard the product can't
    back yet.
    OWN-WORLD: zinc neutral, emerald primary, Source Serif 4 for reading surfaces,
    Inter for chrome, shadcn new-york radius.
    STORY: a student lands, sees one clear "add your first source" action, and an
    honest, quietly-labeled note that progress/quiz features are coming, never faked.
    FIRST VIEWPORT: left sidebar (wordmark, Dashboard/Notebooks/Settings), main
    canvas: greeting header, dashed upload CTA card, empty-state notebook section,
    a muted "coming soon" strip for weak-topics/progress/streaks.
    FORM: assigned structural candidate 3 of 7 (sidebar nav + content canvas),
    surface-scope seed key testkey1; raised with the declined teletext
    challenger's disciplined held-state labeling for the coming-soon strip instead
    of fabricated stat widgets.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the
    finish review, the verdict, and DESIGN.md.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
