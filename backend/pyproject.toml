[project]
name = "ai-tutor-backend"
version = "0.1.0"
description = "AI Tutor FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "lumora-ai",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "pyjwt>=2.10",
    "python-multipart>=0.0.17",
    "google-auth>=2.36",
    "pydantic[email]>=2.13.4",
    "requests>=2.34.2",
    "bcrypt>=5.0.0",
    "celery[redis]>=5.4",
    "pypdf>=5.1",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "pytesseract>=0.3.13",
    "pillow>=11.0",
    "supabase>=2.31.0",
    "pgvector>=0.3.6",
]

[tool.uv.sources]
lumora-ai = { path = "../ai", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
